# @package _global_

# Unlearning config for `python -m src.unlearn_sequential`, derived from tiger_train_flat.yaml.
# The model target is the unlearning subclass (same checkpoint schema), the trainer is
# single-device, and checkpointing and early-stopping callbacks are disabled.

data_dir: ???
semantic_id_path: ???
ckpt_path: ???
num_hierarchies: ???
sequence_length: 120
seed: 2
# Temperature of LETTER's ranking-guided generation loss (1.0 is equivalent to TIGER).
# Must match between training, inference, and unlearning.
letter_temperature: 1.0
# Forget manifest that defines the spam target items for SH@k / ASI@k (skipped if missing).
spam_forget_manifest: ${data_dir}/forget_manifest.json

# Re-initialize the selected layers as ordinary FFNs after loading (same format as
# model.pkm_layers). Top-level key because model.* entries go to the module constructor.
ffn_reinit_layers: null

# Forget/retain layout produced by `src.data.unlearning.split_forget_retain`
forget_subdir: training_forget
retain_subdir: training_retain

# Algorithm group
unlearning:
  algorithm: scif
  deletion_spec: session
  # item_pairs only: also emit rows where a target item appears in the input history.
  include_context_rows: false
  forget_size: null
  retain_samples_used_for_update: 16
  # Retain batch source: subset (retain_samples_used_for_update * |D_f| sampled rows) |
  # full (entire retain split).
  retain_source: subset
  retain_sample_size: null
  repair_sample_bound: null
  retain_max_rows: null
  neighborhood_aware: false
  neighborhood_method: prefix
  neighborhood_aware_sample_rate: 1.0
  neighbor_aware_factor: 8.0
  sid_prefix_length: 2
  progressive_sid_prefix: true
  embedding_path: null
  embedding_epsilon: null
  embedding_max_neighbors: 100
  damping: 0.01
  cg_max_iter: 200
  cg_tol: 1.0e-5
  cg_solution_max_norm: null
  max_norm: null
  update_max_norm: 1.0
  batch_size_per_device: 256
  target_params: tiger
  eval_mode: true
  rows_per_shard: 4096

  # Restrict the update to selected semantic-ID positions: null or "all" | [0,1] | "c1,c2"
  # (cN is 1-based). Only those positions' decoder heads and SID embedding rows move; the
  # backbone moves only if update_positions_backbone=true.
  update_positions: null
  # Number of neighbors per item for the collateral-drift measurement.
  drift_neighbor_k: 32
  # Collateral-drift neighbor definition: prefix (shared code prefix) | embedding (k nearest by cosine).
  drift_neighbor_mode: prefix
  # SID table rows the unified update may move: all | forget | forget_neighborhood.
  code_row_scope: all
  # Restrict the code-row mask to these levels (same syntax as update_positions);
  # affects the SID embedding table only.
  code_row_levels: null
  # Freeze the SID embedding table (backbone and decoder heads still move).
  freeze_sid_table: false
  # lambda_r: weight of the retain (repair) term. With lambda_s=lambda_n=0: lambda_f=0 gives
  # finetune, lambda_f > 0 gives simultaneous ascent (neg_train), lambda_r=0 gives pure ascent.
  lambda_r: 1.0
  # Path to precomputed [N, d_z] latent item representations, used for
  # neighbor selection by coherence_neighbor_method=latent|embedding+latent.
  coherence_latent_path: null
  # Neighbor budget for embedding+latent: full (neighborhood_count per source) | matched (split).
  coherence_union_size: full
  update_positions_backbone: false

  # Update scope (unified): all | pkm_only (only PKM parameters; requires a PKM model).
  # pkm_update_keys / pkm_update_query: also update the PKM keys / query network.
  update_scope: all
  pkm_update_keys: true
  pkm_update_query: true
  # Optimizer for first-order unlearning algorithms: adam | adamw | sgd.
  # Per-algorithm keys (<algo>_optimizer) take precedence.
  optimizer: adam

  # Per-algorithm optimizer overrides (null uses `optimizer`).
  seif_optimizer: null
  kookmin_optimizer: null
  fanchuan_optimizer: null
  neg_train_optimizer: null

  # adam | adamw | sgd, for algorithm=unified.
  unified_optimizer: adam

  # Learning-rate multiplier for the SID embedding table and decoder heads (unified).
  code_lr_scale: 1.0

  # Extra learning-rate multiplier for the adaptive code levels [stable_codes, num_hierarchies);
  # 0.0 freezes them.
  adaptive_code_lr_scale: 1.0
  # Extra learning-rate multiplier for the stable code levels [0, stable_codes).
  stable_code_lr_scale: 1.0

  # Top-t PKM slot selection (requires update_scope=pkm_only):
  # none | af | af_ihf | grad | grad_combined. slot_dot_abs=true penalizes |<g_f, g_r>|.
  slot_selection: none
  slot_top_t: 32
  slot_lambda: 1.0
  slot_mu: 5.0
  slot_dot_abs: false

  # RQ-ID diagnostics (TigerUnlearningModule.diagnose_rq_ids): both | positions | code_sharing.
  diagnostics_mode: both
  # Collateral-drift diagnosis: unlearned checkpoint to compare against ckpt_path.
  drift_unlearned_ckpt: null
  drift_n_queries: 8          # retain query batches to score over
  drift_control_items: 600    # sampled non-sharing items, the comparison group
  drift_item_chunk: 64
  # per-item position profile options
  profile_max_items: 2000

  finetune_steps: 500
  finetune_lr: 0.001
  # adam | sgd.
  finetune_optimizer: adam
  # Early stopping on the retain loss: patience steps without improving by min_delta (0 disables).
  finetune_patience: 0
  finetune_min_delta: 0.0
  neg_train_steps: 200
  neg_train_lr: 0.001
  neg_retain_every: 5
  filter_mode: global
  forget_loss_level: token
  # Unified objective weights: L = lambda_r*L_R + lambda_f*L_F + lambda_s*L_sep + lambda_n*L_n
  lambda_f: 1.0
  lambda_s: 0.1
  # Weight of the coherence loss L_n, which teacher-forces the forget history on the semantic
  # IDs of each target's nearest catalog neighbors (unified only; 0 disables).
  lambda_n: 0.0
  neighborhood_count: 4
  neighborhood_prefix_length: 2
  # Forget rows scored by L_n: target_only (label is a deletion target) | all.
  coherence_rows: target_only
  # Neighborhood P(i_T) for L_n: prefix (shared SID prefix >= neighborhood_prefix_length) |
  # embedding (top-k in the item embedding space; requires embedding_path).
  coherence_neighbor_method: prefix
  # Similarity for embedding neighbors: cosine | l2.
  coherence_embedding_metric: cosine
  # Form of L_n: nll (per-neighbor -log p) | mass (-log of the summed neighborhood probability) |
  # suppress (-log(1 - neighborhood mass), drains the neighborhood).
  coherence_loss_type: nll

  # TRACER baseline (arXiv:2606.07688), algorithm=tracer: token reassignment through
  # per-codeword scores phi, L = L_R + l1*L_F + l2*L_Coh + l3*L_reg. Requires the codebook
  # checkpoint the semantic IDs were built from and unlearning.embedding_path.
  # tracer_rqkmeans_ckpt is an alias of tracer_codebook_ckpt.
  tracer_codebook_ckpt: null
  tracer_rqkmeans_ckpt: null
  tracer_levels: null          # null -> num_hierarchies - 1 (last digit is dedup)
  tracer_temperature: 0.005    # typical range 0.003-0.009
  # Minimum fraction of stored codes that phi=0 must reproduce before TRACER runs.
  tracer_sid_tolerance: 1.0
  tracer_lambda_forget: 1.0    # l1
  tracer_lambda_coherence: 1.0 # l2
  tracer_lambda_reg: 0.001     # l3, the L1 on phi
  tracer_neighborhood_count: 5 # K for P(i_T)
  tracer_steps: 500
  tracer_lr: 1.0e-4            # theta
  tracer_phi_lr: 0.01          # phi (separate, larger)
  # Selective update (Eq. 11): move phi only on codewords more retain-shared than the current
  # assignment and where the forget gradient conflicts.
  tracer_selective_update: true
  # sgd | adam | adamw.
  tracer_optimizer: sgd
  # Commit reassigned codes (hard argmax) at the end; evaluate with the resulting SID tensor.
  tracer_commit: true
  # Upper clamp on the neighborhood mass for coherence_loss_type=suppress.
  coherence_mass_cap: 0.999
  # InfoNCE temperature for L_sep (cosine form).
  sep_temperature: 0.07
  # L_sep negatives: forget_target_only (target items) | forget (all forget-shard items) |
  # random_retain (random retain items).
  sep_negatives: forget_target_only
  # L_sep positives (cosine form): history (items in the user's history) | label (next item).
  sep_positives: history
  # L_sep scoring: generative (sequence log-probability; positive is the label) | cosine.
  sep_loss_type: generative
  # Temperature for sep_loss_type=generative.
  sep_gen_temperature: 1.0
  # Number of negatives for sep_negatives=random_retain (null matches the neighbor set size).
  sep_num_random_negatives: null
  unified_steps: 500
  # Number of epochs. unified: steps = n_epochs * min(n_forget_batches, n_retain_batches),
  # overrides unified_steps; seif: repair epochs. null uses per-algorithm defaults.
  n_epochs: null
  # lambda_p: weight of the preservation term (NLL on retain rows whose label is a forget
  # item), which makes a deletion user-scoped rather than concept-scoped.
  lambda_p: 0.0
  unified_lr: 1.0e-4
  # Restrict the unified update to the adaptive code levels [stable_codes, num_hierarchies);
  # adaptive_update_backbone also lets the backbone move.
  adaptive_codes: false
  stable_codes: 2
  adaptive_update_backbone: false
  # If true, train per-item offsets for the adaptive positions of forget and neighbor items
  # instead of the shared rows; evaluate with +model.adaptive_item_offset_stable_codes=<stable_codes>.
  adaptive_adapter: false
  # Kookmin (gradient-guided reinitialization + scaled retain repair)
  kookmin_init_rate: 0.01
  kookmin_neg_grad_sample_size: 128
  kookmin_retain_epochs: 1
  kookmin_retain_lr: 0.001
  kookmin_scale_for_reinit: 10.0
  # Fanchuan (uniform-pseudolabel KL + contrastive forget/retain)
  fanchuan_lr: 0.001
  fanchuan_uniform_epochs: 1
  fanchuan_contrastive_iters: 8
  fanchuan_contrastive_temperature: 1.15
  fanchuan_retain_epochs_per_iter: 1
  # Seif (Gaussian-noise erase + repair fine-tune)
  seif_erase_std: 0.6
  seif_erase_std_final: 0.005
  seif_repair_epochs: 4
  seif_repair_lr: 0.0007
  seif_weight_decay: 0.0005
  # null: parameters whose name contains "embedding" or "mlp"
  seif_noise_param_keywords: null
  local_repair:
    enabled: false
    logit_suppression: false
    adapter_repair: false
    prefix_repair: false
    mass_regularization: false
    gamma: 1.0

task_name: unlearn
id: ${now:%Y-%m-%d}/${now:%H-%M-%S}
tags:
  - amazon-p5-gr-unlearn-scif

# Data loading (mirrors tiger_train_flat.yaml; template for the forget/retain loaders)
data_loading:
  features_config:
    features:
    - name: sequence_data
      num_placeholder_tokens: 0
      semantic_ids: ???
      is_item_ids: true
      type:
        _target_: torch.__dict__.get
        _args_:
        - int32
    - name: embedding
      type:
        _target_: torch.__dict__.get
        _args_:
        - float32
    - name: text
      type:
        _target_: torch.__dict__.get
        _args_:
        - bytes
    - name: user_id
      is_item_ids: true
      type:
        _target_: torch.__dict__.get
        _args_:
        - int32
  dataset_config:
    dataset:
      _target_: src.data.loading.components.interfaces.SemanticIDDatasetConfig
      user_id_field: user_id
      min_sequence_length: 1
      iterate_per_row: true
      keep_user_id: true
      features_to_consider: ${extract_fields_from_list_of_dicts:${data_loading.features_config.features},
        "name", False, "is_item_ids", "True"}
      num_placeholder_tokens_map: ${create_map_from_list_of_dicts:${data_loading.features_config.features},
        "name", "num_placeholder_tokens"}
      semantic_id_map: ${create_map_from_list_of_dicts:${data_loading.features_config.features},
        "name", "semantic_ids"}
      data_iterator:
        _target_: src.data.loading.components.iterators.TFRecordIterator
      preprocessing_functions:
      - _target_: src.data.loading.components.pre_processing.filter_features_to_consider
        _partial_: true
      - _target_: src.data.loading.components.pre_processing.convert_to_dense_numpy_array
        _partial_: true
      - _target_: src.data.loading.components.pre_processing.convert_fields_to_tensors
        _partial_: true
      - _target_: src.data.loading.components.pre_processing.map_sparse_id_to_semantic_id
        _partial_: true
        features_to_apply:
        - sequence_data
        num_hierarchies: ${model.num_hierarchies}
  train_dataloader_config:
    dataloader:
      _target_: src.data.loading.components.interfaces.SequenceDataloaderConfig
      dataset_class:
        _target_: src.data.loading.components.dataloading.UnboundedSequenceIterable
        _partial_: true
      data_folder: ${paths.data_dir}/training
      should_shuffle_rows: false
      labels:
        sequence_data:
          transform:
            _target_: src.data.loading.components.label_function.NextKTokenMasking
            next_k: ${model.num_hierarchies}
      batch_size_per_device: 32
      num_workers: 0
      timeout: 0
      assign_files_by_size: false
      oov_token: null
      masking_token: -1
      sequence_length: ${sequence_length}
      padding_token: -1
      drop_last: false
      persistent_workers: false
      collate_fn:
        _target_: src.data.loading.components.collate_functions.collate_with_sid_causal_duplicate
        _partial_: true
        sequence_length: ${data_loading.train_dataloader_config.dataloader.sequence_length}
        padding_token: ${data_loading.train_dataloader_config.dataloader.padding_token}
        sequence_field_name: sequence_data
        sid_hierarchy: ${model.num_hierarchies}
        max_batch_size: 512
      dataset_config:
        _target_: src.data.loading.components.interfaces.SemanticIDDatasetConfig
        user_id_field: user_id
        min_sequence_length: 1
        iterate_per_row: true
        keep_user_id: true
        features_to_consider: ${extract_fields_from_list_of_dicts:${data_loading.features_config.features},
          "name", False, "is_item_ids", "True"}
        num_placeholder_tokens_map: ${create_map_from_list_of_dicts:${data_loading.features_config.features},
          "name", "num_placeholder_tokens"}
        semantic_id_map:
          sequence_data:
            _target_: torch.load
            _args_:
            - _target_: src.utils.file_utils.open_local_or_remote
              file_path: ${semantic_id_path}
              mode: rb
        data_iterator:
          _target_: src.data.loading.components.iterators.TFRecordIterator
        preprocessing_functions:
        - _target_: src.data.loading.components.pre_processing.filter_features_to_consider
          _partial_: true
        - _target_: src.data.loading.components.pre_processing.convert_to_dense_numpy_array
          _partial_: true
        - _target_: src.data.loading.components.pre_processing.convert_fields_to_tensors
          _partial_: true
        - _target_: src.data.loading.components.pre_processing.map_sparse_id_to_semantic_id
          _partial_: true
          features_to_apply:
          - sequence_data
          num_hierarchies: ${model.num_hierarchies}
      assign_all_files_per_worker: true
  datamodule:
    _target_: src.data.loading.datamodules.sequence_datamodule.SequenceDataModule
    train_dataloader_config: ${..train_dataloader_config.dataloader}

# Model (same constructor arguments as tiger_train_flat.yaml)
model:
  huggingface_model:
    _target_: transformers.T5EncoderModel
    config:
      _target_: transformers.T5Config
      vocab_size: 256
      d_model: 128
      num_heads: 6
      dropout_rate: 0.15
      d_ff: 1024
      d_kv: 64
      num_layers: 4
  _target_: src.models.modules.semantic_id.letter_unlearning_module.LetterUnlearningModule
  # Semantic IDs come from the LETTER tokenizer (letter_rqvae_train_flat.yaml).
  letter_temperature: ${letter_temperature}
  feature_to_model_input_map:
    sequence_data: input_ids
    user_id: user_id
  postprocessor: null
  aggregator: null
  loss_function: ${loss.loss_function}
  optimizer: ${optim.optimizer}
  scheduler: ${optim.scheduler}
  evaluator: ${eval.evaluator}
  weight_tying: true
  compile: false
  decoder:
    _target_: transformers.models.t5.modeling_t5.T5Stack
    config:
      _target_: transformers.models.t5.configuration_t5.T5Config
      vocab_size: ${model.huggingface_model.config.vocab_size}
      d_model: ${model.huggingface_model.config.d_model}
      num_heads: ${model.huggingface_model.config.num_heads}
      dropout_rate: 0.15
      d_ff: ${model.huggingface_model.config.d_ff}
      d_kv: ${model.huggingface_model.config.d_kv}
      num_layers: 4
      is_decoder: true
      is_encoder_decoder: false
    embed_tokens:
      _target_: torch.nn.Embedding
      num_embeddings: ${model.huggingface_model.config.vocab_size}
      embedding_dim: ${model.huggingface_model.config.d_model}
  num_hierarchies: ${num_hierarchies}
  num_user_bins: null
  codebooks: ${data_loading.train_dataloader_config.dataloader.dataset_config.semantic_id_map.sequence_data}
  # Input-side item-token aggregation; must match the trained checkpoint.
  item_token_aggregation: null
  mlp_layers: 2
  # PKM layers; must match the trained checkpoint (see tiger_train_flat.yaml).
  pkm_layers: null
  pkm_mode: replace
  pkm_params:
    k_dim: ${model.huggingface_model.config.d_model}
    heads: 4
    knn: 32
    n_keys: 512
    query_batchnorm: false
    input_dropout: 0.0
    query_dropout: 0.0
    value_dropout: 0.0
    sparse: false
    # Value-table init: normal | zeros.
    value_init: normal
    value_init_scale: 1.0
    # See tiger_train_flat.yaml for these options.
    query_norm: none
    warmup_knn: 0
    warmup_noise: 0.0
    warmup_steps: 0

# Callbacks: no validation loop, so checkpoint and early-stopping callbacks are disabled.
callbacks:
  model_checkpoint: null
  early_stopping: null
  model_summary:
    _target_: lightning.pytorch.callbacks.RichModelSummary
    max_depth: -1

# Logger
logger:
  csv:
    _target_: lightning.pytorch.loggers.csv_logs.CSVLogger
    save_dir: ${paths.output_dir}
    name: csv/
    prefix: ''

# The trainer is never fit; a single device keeps SCIF in one autograd process.
trainer:
  _target_: lightning.pytorch.trainer.Trainer
  default_root_dir: ${paths.output_dir}
  max_steps: 1
  max_epochs: 1
  accelerator: gpu
  devices: 1
  num_nodes: 1
  precision: 32-true
  enable_progress_bar: false
  log_every_n_steps: 100
  # Best-effort reproducibility for SCIF (CUDA ops may still vary by driver).
  deterministic: true
  strategy: auto
  num_sanity_val_steps: 0

paths:
  root_dir: .
  data_dir: ${data_dir}
  log_dir: ${paths.root_dir}/logs
  output_dir: ${hydra:runtime.output_dir}
  work_dir: ${hydra:runtime.cwd}
  profile_dir: ${hydra:run.dir}/profile_output
  metadata_dir: ${paths.output_dir}/metadata

extras:
  ignore_warnings: false
  enforce_tags: true
  print_config_warnings: true
  print_config: true

loss:
  loss_function:
    _target_: torch.nn.CrossEntropyLoss

optim:
  optimizer:
    _target_: torch.optim.Adam
    _partial_: true
    lr: 0.001
    weight_decay: 0.0001
  scheduler: null

eval:
  evaluator:
    _target_: src.components.eval_metrics.SIDRetrievalEvaluator
    top_k_list:
    - 5
    - 10
    metrics:
      ndcg:
        _target_: src.components.eval_metrics.NDCG
        _partial_: true
      recall:
        _target_: src.components.eval_metrics.Recall
        _partial_: true
    # Spam-exposure metrics (SH@k, ASI@k); skipped if the forget manifest is absent.
    spam_metrics:
      SH:
        _target_: src.components.eval_metrics.SpamHitRate
        _partial_: true
      ASI:
        _target_: src.components.eval_metrics.AvgSpamItems
        _partial_: true
      TPM:
        _target_: src.components.eval_metrics.TargetProbMass
        _partial_: true
    forget_manifest_path: ${spam_forget_manifest}
    semantic_id_path: ${semantic_id_path}
    num_hierarchies: ${num_hierarchies}
